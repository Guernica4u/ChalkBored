<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #000; color: #eee; font: 14px system-ui, sans-serif; }
  header { padding: 14px 16px; }
  h1 { margin: 0 0 4px; font-size: 18px; }
  p { margin: 0; color: #aaa; }
  table { border-collapse: collapse; margin: 10px 16px; }
  td { padding: 6px 10px 6px 0; }
  button, a.btn { padding: 6px 12px; border-radius: 6px; border: 1px solid #444; background: #1a1a1a; color: #eee; cursor: pointer; font: inherit; text-decoration: none; }
  button.on { border-color: #fff; }
  #box { position: relative; height: calc(100vh - 290px); min-height: 300px; margin: 0 16px 16px; border: 1px solid #333; }
  #box iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<header>
  <h1>Which one works?</h1>
  <p>Try each: "Open here" shows it below, like Chalk Browser does; "Open alone" opens it in its own tab. Note which ones show Tide and which stay white or blocked.</p>
</header>
<table id="list"></table>
<div id="box"></div>
<script>
// Older and moved copies of Tide, to find what the school filter blocks. Temporary.
const VERSIONS = [
  ["A", "tide/", "Today's Tide"],
  ["B", "lab/", "Today's Tide, at a different address"],
  ["C", "t32/", "Before Tide's own design (last GUST-based one)"],
  ["D", "t29/", "With the backup engine"],
  ["E", "t27/", "Before addresses were scrambled"]
];
const list = document.getElementById("list"), box = document.getElementById("box");
for (const [id, path, what] of VERSIONS) {
  const tr = list.insertRow();
  tr.insertCell().innerHTML = "<b>" + id + "</b>";
  tr.insertCell().textContent = what;
  const here = document.createElement("button");
  here.textContent = "Open here";
  here.onclick = () => {
    document.querySelectorAll("#list button").forEach(b => b.classList.toggle("on", b === here));
    const f = document.createElement("iframe");
    f.src = path;
    f.allow = "fullscreen; autoplay; encrypted-media; picture-in-picture; clipboard-write";
    f.setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms allow-modals allow-pointer-lock allow-presentation allow-orientation-lock allow-downloads");
    box.replaceChildren(f);
  };
  tr.insertCell().appendChild(here);
  const alone = document.createElement("a");
  alone.className = "btn"; alone.href = path; alone.target = "_blank"; alone.textContent = "Open alone";
  tr.insertCell().appendChild(alone);
}
</script>
</body>
</html>
