<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Botany Defense</title>
  <style>html, body, #player { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }</style>
  <script src="https://unpkg.com/@ruffle-rs/ruffle@0.7.1/ruffle.js" integrity="sha384-6NrmfJx+zTZZPW41eipMGvyVrfvsDKenrh0v/YJ+nJq0WzzLvOHX6GCcQQ1GbIic" crossorigin="anonymous"></script>
</head>
<body>
  <div id="player"></div>
  <script>
    window.addEventListener('load', () => {
      const player = window.RufflePlayer.newest().createPlayer();
      player.style.width = '100%';
      player.style.height = '100%';
      document.getElementById('player').appendChild(player);
      player.load({ url: 'lesson.swf', base: './' });
    });
  </script>
</body>
</html>
