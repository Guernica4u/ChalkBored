<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bloons math - solving</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #player-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="player-container"></div>

    <!-- Ruffle Emulator CDN Script -->
    <script>window.RufflePlayer = window.RufflePlayer || {}; window.RufflePlayer.config = { quality: 'medium', preferredRenderer: 'webgl' };</script>
    <script src="Flash-Player-2/ruffle.js"></script>

    <script>
        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            player.style.width = "100%";
            player.style.height = "100%";
            document.getElementById("player-container").appendChild(player);
            
            // Replace "YOUR_SWF_FILE_NAME.swf" with your actual uploaded file name!
            player.load("/SWF/Bloons-Math.swf");
        });
    </script>
</body>
</html>
