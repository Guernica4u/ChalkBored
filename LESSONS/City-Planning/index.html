<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Landscaper</title>
    <link rel="icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-mobile-warning">
        WebGL builds are not supported on mobile devices.
      </div>
    </div>
    <script>
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      // The game data is 31 MB, more than one file may be, so it is stored as
      // three parts and joined back into a single blob here.
      var DATA_PARTS = 3;
      var config = {
        dataUrl: null,
        frameworkUrl: buildUrl + "/WebGL.framework.js",
        codeUrl: buildUrl + "/WebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "3kh0",
        productName: "Landscaper",
        productVersion: "0.23",
      };

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var mobileWarning = document.querySelector("#unity-mobile-warning");

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        config.devicePixelRatio = 1;
        mobileWarning.style.display = "block";
        setTimeout(() => {
          mobileWarning.style.display = "none";
        }, 5000);
      }
      canvas.style.background = "url('" + buildUrl + "/WebGL.jpg') center / cover";
      loadingBar.style.display = "block";

      async function joinData() {
        var parts = [];
        for (var i = 1; i <= DATA_PARTS; i++) {
          var res = await fetch(buildUrl + "/WebGL.data.part" + i + ".bin");
          if (!res.ok) throw new Error("part " + i + " did not load");
          parts.push(await res.arrayBuffer());
        }
        return URL.createObjectURL(new Blob(parts));
      }

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        joinData()
          .then((url) => {
            config.dataUrl = url;
            return createUnityInstance(canvas, config, (progress) => {
              progressBarFull.style.width = 100 * progress + "%";
            });
          })
          .then(() => {
            loadingBar.style.display = "none";
          })
          .catch((message) => {
            alert(message);
          });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
