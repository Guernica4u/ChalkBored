<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Momentum Lab</title>
    <link rel="shortcut icon" href="style/favicon.ico">
    <link rel="stylesheet" href="style/style.css">
	<script src="UnityLoader.js"></script>
    <script src="UnityProgress.js"></script>
    <script>
      var gameInstance = UnityLoader.instantiate("gameContainer", "build.json", {onProgress: UnityProgress});
    </script>
    <style>html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }</style>
  </head>
  <body>
    <div class="webgl-content">
      <div id="gameContainer" style="width: min(100vw, calc(100vh * 800 / 533)); height: min(100vh, calc(100vw * 533 / 800));"></div>
    </div>
  </body>
</html>
