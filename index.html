<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chalkbored</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    background-color: #0d1117;
    color: #e6edf3;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    margin: 0;
    padding: 0;
  }
  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 32px;
    background-color: #161b22;
    border-bottom: 1px solid #30363d;
  }
  .nav-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 20px;
    font-weight: bold;
  }
  .nav-links {
    display: flex;
    gap: 28px;
  }
  .nav-links a {
    color: #e6edf3;
    text-decoration: none;
    font-weight: bold;
    font-size: 15px;
  }
  .nav-links a:hover {
    color: #2ea44f;
  }
  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px;
  }
  h1 {
    margin-bottom: 40px;
  }
  section {
    max-width: 700px;
    width: 100%;
    margin-bottom: 60px;
  }
  section.hidden {
    display: none;
  }
  .page-label {
    font-size: 32px;
    margin-bottom: 24px;
    border-bottom: 2px solid #30363d;
    padding-bottom: 12px;
  }
  section h2 {
    font-size: 26px;
    margin-bottom: 16px;
  }
  section p {
    font-size: 16px;
    line-height: 1.6;
  }
  section a {
    color: #58a6ff;
  }
  .btn-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    justify-content: center;
    max-width: 700px;
  }
  .game-btn {
    background-color: #2ea44f;
    color: white;
    padding: 14px 24px;
    font-size: 18px;
    font-weight: bold;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  .game-btn:hover {
    background-color: #2c974b;
  }
</style>
</head>
<body>

<nav>
  <div class="nav-title">
    <span>ChalkBored</span>
  </div>
  <div class="nav-links">
    <a href="#tutorials">Tutorials</a>
    <a href="#press-and-play">Press &amp; Play</a>
    <a href="#chat">Chat</a>
  </div>
</nav>

<main>

<section id="tutorials">
  <h1 class="page-label">Tutorials</h1>
  <h2>HTML TUTORIAL</h2>
  <p>First find an html file, (cough git cough hub)</p>
  <p>Then go to <a href="https://html.onlineviewer.net/" target="_blank">https://html.onlineviewer.net/</a> and press import file</p>
</section>

<section id="press-and-play" class="hidden">
  <h1 class="page-label">Press &amp; Play</h1>

  <div class="btn-grid">
    <button class="game-btn" data-url="https://guernica4u.github.io/BTD4/">BTD4</button>
    <button class="game-btn" data-url="https://guernica4u.github.io/Code-Type/">EaglerCraft</button>
    <button class="game-btn" data-url="https://xoriushourz.github.io/FinalEarth2/">Final Earth 2</button>
  </div>
</section>

<section id="chat" class="hidden" style="max-width: 460px;">
  <h1 class="page-label">Chat</h1>
  <iframe src="chat.html" style="width:100%; height:640px; border:none; border-radius:14px;" title="Site Chat"></iframe>
</section>

</main>

<script>
  // Shared handler for all game buttons: opens a blank tab and writes a
  // transparent-background page into it containing a fullscreen iframe
  // pointing at the game's hosted URL.
  function openAboutBlank(gameUrl) {
    var win = window.open();

    if (!win) {
      alert("Please allow popups for this site!");
      return;
    }

    var html = `
      <!DOCTYPE html>
      <html>
      <head>
        <meta charset="utf-8">
        <title>Game</title>
        <style>
          body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
          }
          #game-frame {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: none;
          }
        </style>
      </head>
      <body>
        <iframe id="game-frame" src="${gameUrl}" allowfullscreen></iframe>
      </body>
      </html>
    `;

    win.document.open();
    win.document.write(html);
    win.document.close();

    // Force keyboard focus into the iframe so games register controls
    // (kept from the previous version — still needed for the same reason).
    setTimeout(function() {
      var frame = win.document.getElementById('game-frame');
      if (frame && frame.contentWindow) frame.contentWindow.focus();
    }, 300);
  }

  document.querySelectorAll('.game-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      openAboutBlank(btn.dataset.url);
    });
  });

  // Nav links show only the matching page section and hide the rest.
  document.querySelectorAll('.nav-links a').forEach(function(link) {
    link.addEventListener('click', function(e) {
      e.preventDefault();
      var targetId = link.getAttribute('href').substring(1);
      document.querySelectorAll('main > section').forEach(function(sec) {
        sec.classList.toggle('hidden', sec.id !== targetId);
      });
    });
  });
</script>

</body>
</html>
