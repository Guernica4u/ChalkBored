<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Chalk TV</title>
<link rel="icon" href="favicon.svg">
<style>
  /* Chalk TV: educational films and series for class and curiosity. */
  :root {
    --paper: #0b0b0b;
    --paper-2: #171717;
    --card: #121212;
    --ink: #f2f2f2;
    --pencil: #9a9a9a;
    --edge: #2e2e2e;
    --accent: #f2f2f2;
    --accent-ink: #0b0b0b;
    --highlight: #3a3a3a;
    --rail: #080808;
    --r: 4px;
    --pbar: 40px;
    --body: 'Aptos', 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  html { background: var(--paper); }
  body { background: var(--paper); color: var(--ink); font: 16px/1.55 var(--body); letter-spacing: .002em; -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  @keyframes settle { from { opacity: 0; transform: translateY(5px) scale(.988); } }
  @keyframes mark { from { opacity: 0; transform: translateY(-3px) scale(.86); } }
  @keyframes veil { from { opacity: 0; } }
  .nav button, .btn, .row-nav button, #p-back, .dots button {
    transition: background-color .18s ease, color .18s ease, border-color .18s ease, transform .18s ease, width .18s ease;
  }
  .nav button:active, .btn:active, .row-nav button:active, #p-back:active { transform: translateY(1px); }
  @media (prefers-reduced-motion: reduce) {
    #hero .art, #hero .copy > *, .row, .card, .card .rank, #details, #details .box, #player, #p-bar { animation: none; }
    .strip { scroll-behavior: auto; }
    .nav button, .btn, .row-nav button, #p-back, .dots button, .card { transition: none; }
  }

  /* ---- top bar ---- */
  #top {
    position: fixed; inset: 0 0 auto; z-index: 8; height: 64px;
    display: flex; align-items: center; gap: 18px; padding: 0 clamp(16px, 4vw, 54px);
    background: linear-gradient(180deg, rgba(11,11,11,.97), rgba(11,11,11,.76) 72%, transparent);
    border-bottom: 1px solid var(--edge);
  }
  #brand { border: 0; background: none; padding: 0; font-size: 1.35rem; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; }
  #brand b { color: var(--pencil); font-weight: 400; }
  .nav { display: flex; gap: 4px; }
  .nav button { border: 1px solid transparent; background: none; padding: 7px 12px; border-radius: var(--r); color: var(--pencil); font-size: .92rem; }
  .nav button:hover { color: var(--ink); background: var(--highlight); }
  .nav button.on { color: var(--accent-ink); background: var(--accent); }
  #search { margin-left: auto; display: flex; width: min(320px, 34vw); }
  #q {
    width: 100%; height: 38px; padding: 0 12px; border: 1px solid var(--edge); border-radius: var(--r);
    background: var(--card); outline: 0; color: var(--ink);
  }
  #q::placeholder { color: var(--pencil); }
  #q:focus { border-color: var(--accent); background: var(--paper-2); }

  /* ---- browsing ---- */
  #browse { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding-bottom: 70px; scrollbar-width: thin; }
  #browse::-webkit-scrollbar { width: 9px; }
  #browse::-webkit-scrollbar-thumb { background: var(--edge); border-radius: 9px; }

  /* hero */
  #hero { position: relative; min-height: min(68vh, 620px); display: flex; align-items: flex-end; padding: 96px clamp(16px, 4vw, 54px) 62px; isolation: isolate; }
  #hero .art, #hero .fade { position: absolute; inset: 0; z-index: -2; background-size: cover; background-position: center 18%; }
  #hero .art { animation: veil .55s ease backwards; }
  #hero .fade { z-index: -1; background: linear-gradient(90deg, rgba(11,11,11,.98) 0%, rgba(11,11,11,.80) 40%, rgba(11,11,11,.20) 76%), linear-gradient(0deg, var(--paper) 1%, transparent 55%); }
  #hero .copy { width: min(660px, 100%); }
  #hero .copy > * { animation: rise .46s cubic-bezier(.2,.7,.2,1) backwards; }
  #hero .copy > :nth-child(2) { animation-delay: .05s; }
  #hero .copy > :nth-child(3) { animation-delay: .10s; }
  #hero .copy > :nth-child(4) { animation-delay: .15s; }
  #hero .copy > :nth-child(5) { animation-delay: .20s; }
  .eyebrow { display: flex; align-items: center; margin-bottom: 12px; color: var(--pencil); font-size: .72rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
  #hero h1 { margin: 0 0 12px; font-size: clamp(2.1rem, 5.4vw, 4.3rem); line-height: 1.06; letter-spacing: -.02em; font-weight: 700; text-wrap: balance; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; margin: 0 0 16px; color: var(--pencil); font-size: .88rem; }
  .meta .score { color: var(--ink); font-weight: 700; }
  .meta .chip { padding: 2px 8px; border: 1px solid var(--edge); border-radius: var(--r); font-size: .76rem; }
  #hero p { margin: 0 0 22px; max-width: 56ch; color: #c9c9c9; font-size: clamp(.92rem, 1.4vw, 1.02rem); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn { min-height: 42px; padding: 0 20px; border: 1px solid var(--edge); border-radius: var(--r); background: var(--card); font-weight: 600; }
  .btn:hover { background: var(--highlight); }
  .btn.main { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
  .btn.main:hover { background: #d9d9d9; border-color: #d9d9d9; }
  .dots { position: absolute; right: clamp(16px, 4vw, 54px); bottom: 64px; display: flex; gap: 7px; }
  .dots button { width: 7px; height: 7px; padding: 0; border: 0; border-radius: 0; background: var(--edge); }
  .dots button.on { width: 24px; background: var(--accent); }

  /* rows and cards */
  .row { margin-top: 12px; animation: rise .42s ease backwards; animation-delay: calc(var(--r, 0) * 55ms); }
  .row-head { display: flex; align-items: center; gap: 10px; padding: 0 clamp(16px, 4vw, 54px); margin: 12px 0 10px; }
  .row-head h2 { margin: 0; font-size: clamp(1.05rem, 1.7vw, 1.32rem); letter-spacing: -.01em; font-weight: 700; }
  .row-head .hint { color: var(--pencil); font-size: .78rem; margin-left: 4px; }
  .row-nav { margin-left: auto; display: flex; gap: 6px; }
  .row-nav button { width: 30px; height: 30px; border: 1px solid var(--edge); border-radius: var(--r); background: var(--card); color: var(--ink); line-height: 1; }
  .row-nav button:hover { background: var(--accent); color: var(--accent-ink); }
  .strip { display: flex; gap: 12px; overflow-x: auto; padding: 6px clamp(16px, 4vw, 54px) 14px; scroll-behavior: smooth; scrollbar-width: none; }
  .strip::-webkit-scrollbar { display: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px 12px; padding: 6px clamp(16px, 4vw, 54px) 20px; }
  .card { position: relative; flex: none; width: 252px; height: 142px; padding: 0; border: 1px solid var(--edge); border-radius: var(--r); overflow: hidden; background: var(--card); text-align: left; transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease; animation: rise .36s cubic-bezier(.2,.7,.2,1) backwards; animation-delay: calc(var(--i, 0) * 24ms); }
  .grid .card { width: 100%; }
  .card:hover, .card:focus-visible { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 10px 28px rgba(0,0,0,.65); z-index: 2; }
  .card .art { position: absolute; inset: 0; background-size: cover; background-position: center; background-color: var(--highlight); }
  .card .shade { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,.92) 0%, rgba(0,0,0,.32) 48%, transparent 100%); }
  .card .cap { position: absolute; inset: auto 0 0; padding: 10px 12px; }
  .card .cap .t { display: block; font-weight: 700; font-size: .92rem; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .cap .s { display: block; margin-top: 3px; color: #bdbdbd; font-size: .76rem; }
  .card .rank { position: absolute; top: 8px; left: 8px; z-index: 2; display: grid; place-items: center; min-width: 22px; height: 22px; padding: 0 5px; border: 1px solid rgba(242,242,242,.78); border-radius: 2px; background: rgba(11,11,11,.74); color: var(--ink); font: 700 .72rem/1 var(--body); font-variant-numeric: tabular-nums; letter-spacing: .02em; text-shadow: 0 1px 3px rgba(0,0,0,.8); box-shadow: 0 2px 10px rgba(0,0,0,.5), inset 0 0 0 1px rgba(242,242,242,.08); transform: rotate(-1.5deg); animation: mark .26s ease .1s backwards; }
  .card .prog { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--highlight); }
  .card .prog i { display: block; height: 100%; background: var(--accent); }
  .msg { margin: 26px clamp(16px, 4vw, 54px); color: var(--pencil); }
  .result-count { margin: 0 clamp(16px, 4vw, 54px) 8px; color: var(--pencil); font-size: .82rem; }
  .result-count b { color: var(--ink); font-weight: 700; }
  .foot { padding: 26px clamp(16px, 4vw, 54px) 46px; color: var(--pencil); font-size: .76rem; border-top: 1px solid var(--edge); margin-top: 30px; }

  /* details */
  #details { position: fixed; inset: 0; z-index: 12; display: grid; place-items: center; padding: 20px; background: rgba(0,0,0,.82); animation: veil .18s ease backwards; }
  #details .box { position: relative; width: min(880px, 100%); max-height: min(90vh, 760px); overflow: hidden auto; border: 1px solid var(--edge); border-radius: 6px; background: var(--paper-2); box-shadow: 0 30px 90px rgba(0,0,0,.7); animation: settle .24s cubic-bezier(.2,.7,.2,1) backwards; }
  #details .cover { position: relative; height: 280px; background-size: cover; background-position: center; }
  #details .cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, var(--paper-2), transparent 75%); }
  #details .body { position: relative; margin-top: -58px; padding: 0 34px 32px; display: grid; grid-template-columns: 168px 1fr; gap: 26px; }
  #details .poster { width: 168px; aspect-ratio: 2/3; border-radius: var(--r); background-size: cover; background-position: center; box-shadow: 0 16px 36px rgba(0,0,0,.6); border: 1px solid var(--edge); }
  #details h3 { margin: 0 0 8px; font-size: clamp(1.5rem, 3vw, 2.15rem); letter-spacing: -.02em; }
  #details p { margin: 0 0 18px; color: #c9c9c9; line-height: 1.65; }
  #d-close-x { position: absolute; top: 14px; right: 14px; z-index: 2; width: 36px; height: 36px; border: 1px solid var(--edge); border-radius: var(--r); background: var(--paper); font-size: 1.2rem; }
  #d-picker { margin-top: 18px; border-top: 1px solid var(--edge); padding-top: 16px; }
  .pick-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .pick-head label { color: var(--pencil); font-size: .72rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  #d-season { border: 1px solid var(--edge); border-radius: var(--r); background: var(--card); padding: 6px 10px; font-size: .82rem; }
  #d-epcount { color: var(--pencil); font-size: .78rem; }
  #d-eps { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; max-height: 232px; overflow-y: auto; padding-right: 4px; }
  .ep { position: relative; display: flex; flex-direction: column; justify-content: flex-end; min-height: 88px; padding: 8px 9px; border: 1px solid var(--edge); border-radius: var(--r); background: var(--card); text-align: left; overflow: hidden; }
  .ep .art, .ep .shade { position: absolute; inset: 0; }
  .ep .art { background-size: cover; background-position: center; opacity: .5; }
  .ep .shade { background: linear-gradient(0deg, rgba(0,0,0,.94), rgba(0,0,0,.20)); }
  .ep > span:not(.art):not(.shade) { position: relative; }
  .ep .no { color: var(--pencil); font-size: .7rem; font-weight: 700; }
  .ep .name { font-size: .82rem; font-weight: 600; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ep .meta { color: #bdbdbd; font-size: .7rem; }
  .ep:hover, .ep.on { border-color: var(--accent); }
  .ep.on .shade { background: linear-gradient(0deg, rgba(0,0,0,.96), rgba(242,242,242,.14)); }
  #d-eps .ep.more { grid-column: 1 / -1; min-height: 38px; align-items: center; justify-content: center; color: var(--pencil); font-size: .78rem; }
  @media (max-width: 640px) {
    #hero .dots { display: none; }
    #details .body { grid-template-columns: 1fr; margin-top: -30px; padding: 0 20px 24px; }
    #details .poster { width: 116px; }
    #details .cover { height: 200px; }
    #d-eps { grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); max-height: 210px; }
  }

  /* player: the viewing pane fills this area */
  #player { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; background: #000; animation: veil .2s ease backwards; }
  #p-bar { animation: rise .24s ease backwards; }
  #p-bar { display: flex; align-items: center; gap: 9px; flex: none; height: var(--pbar); padding: 0 9px; background: #0d0d0d; border-bottom: 1px solid #242424; }
  #p-back { border: 1px solid #2a2a2a; background: #101010; border-radius: var(--r); padding: 4px 9px; font-size: .78rem; }
  #p-back:hover { background: var(--accent); color: var(--accent-ink); }
  #p-title { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: .84rem; font-weight: 700; }
  #p-stage { position: relative; flex: 1; background: #000; }
  #p-wait { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--pencil); pointer-events: none; }
  #p-open { border: 1px solid var(--edge); border-radius: var(--r); background: var(--card); padding: 5px 10px; font-size: .78rem; pointer-events: auto; }
  #pane { position: fixed; width: 1px; height: 1px; left: -10px; top: 0; border: 0; opacity: 0; pointer-events: none; }
  body.playing #pane { left: 0; top: var(--pbar); width: 100%; height: calc(100% - var(--pbar)); opacity: 1; pointer-events: auto; z-index: 21; background: #000; }
</style>
</head>
<body>
<header id="top">
  <button id="brand" type="button" title="Chalk TV home">Chalk<b>TV</b></button>
  <nav class="nav" id="nav">
    <button type="button" data-section="all" class="on">Home</button>
    <button type="button" data-section="anime">Anime</button>
  </nav>
  <form id="search" role="search"><input id="q" type="search" placeholder="Search films and series" autocomplete="off" spellcheck="false" aria-label="Search films and series"></form>
</header>

<main id="browse"></main>

<div id="details" hidden>
  <div class="box" role="dialog" aria-modal="true" aria-labelledby="d-title">
    <button id="d-close-x" type="button" aria-label="Close">&#10005;</button>
    <div class="cover" id="d-cover"></div>
    <div class="body">
      <div class="poster" id="d-poster"></div>
      <div>
        <h3 id="d-title"></h3>
        <div class="meta" id="d-meta"></div>
        <p id="d-text"></p>
        <div id="d-picker" hidden>
          <div class="pick-head"><label for="d-season">Season</label><select id="d-season"></select><span id="d-epcount"></span></div>
          <div id="d-eps"></div>
        </div>
        <div class="actions"><button class="btn main" id="d-play" type="button">&#9654; Play</button><button class="btn" id="d-close" type="button">Close</button></div>
      </div>
    </div>
  </div>
</div>

<div id="player" hidden>
  <div id="p-bar"><button id="p-back" type="button">&#8249; Back to Chalk TV</button><div id="p-title"></div></div>
  <div id="p-stage"><div id="p-wait">Loading film…</div></div>
</div>

<script>
/* Chalk TV: classroom-friendly film discovery. What the page needs is loaded quietly
   and opened here for viewing. */
const $ = id => document.getElementById(id);
const decode = s => atob(s);                     // quiet configuration
const encode = s => btoa(s);
const SITE = decode("aHR0cHM6Ly9tb3Z5LnN4");
const LIBRARY = decode("aHR0cHM6Ly9kYi53ZWNvbGxlZ2UubmV0LzM=");
const CONTINUE = "chalk-tv.continue";
const RELAY = decode("d3NzOi8vZmVybi5iZXN0L3dpc3Av");
const MSG = decode("dGlkZQ==");                      // viewing protocol key
const HASH = decode("Y2Zn");                        // quiet start key
const PANE_PAGE = new URL(decode("dGlkZS8="), location.href).href;   // local viewing pane in this copy
const PANE_ORIGIN = new URL(PANE_PAGE).origin;
const ART_HOST = SITE.replace("://", "://www.");
const ADULT = ["sex", "sexy", "nude", "nudist", "naked", "erotic", "stripper", "striptease", "lust", "burlesque", "porn"];
const ADULT_RE = /\b(sex|sexy|nude|nudist|naked|erotic|stripper|striptease|lust|burlesque|porn)/i;   // the school-safe list from the old app
const GENRES = { 12:"Adventure",14:"Fantasy",16:"Animation",18:"Drama",27:"Horror",28:"Action",
  35:"Comedy",36:"History",37:"Western",53:"Thriller",80:"Crime",99:"Documentary",878:"Sci-fi",
  9648:"Mystery",10402:"Music",10749:"Romance",10751:"Family",10762:"Kids",10763:"News",
  10764:"Reality",10765:"Sci-fi & fantasy",10766:"Soap",10767:"Talk",10768:"War & politics",10770:"TV movie" };
for (const k of ["chalk-tv.site", "chalk-tv.mode", "chalk-tv.relay"]) try { localStorage.removeItem(k); } catch (e) {}

/* ---- viewing pane, out of sight until a film plays ---- */
const pane = document.createElement("iframe");
pane.id = "pane";
pane.title = "Film player";
pane.allow = "fullscreen; autoplay; encrypted-media; picture-in-picture";
pane.allowFullscreen = true;
pane.src = PANE_PAGE + "#" + HASH + "=" + encodeURIComponent(JSON.stringify({ ui: "tv", fresh: true, relayB64: encode(RELAY) }));
document.body.appendChild(pane);
let ready, readyNow;
ready = new Promise(ok => { readyNow = ok; });
let seq = 0;
const waiting = new Map();
const post = msg => pane.contentWindow.postMessage(msg, PANE_ORIGIN);
addEventListener("message", e => {
  if (e.source !== pane.contentWindow || e.origin !== PANE_ORIGIN || !e.data) return;
  if (e.data[MSG] === "ready") readyNow();
  if (e.data[MSG] === "fetched" && waiting.has(e.data.id)) {
    waiting.get(e.data.id)(e.data);
    waiting.delete(e.data.id);
  }
});
/* one request for a page or image; resolves with { status, type, body:ArrayBuffer } */
function get(url) {
  return ready.then(() => new Promise((ok, fail) => {
    const id = ++seq;
    const timer = setTimeout(() => { waiting.delete(id); fail(new Error("timed out")); }, 30000);
    waiting.set(id, r => {
      clearTimeout(timer);
      r.status === 200 ? ok(r) : fail(new Error(r.error || "status " + r.status));
    });
    post({ [MSG]: "fetch", id, url });
  }));
}
const getJson = url => get(url).then(r => JSON.parse(new TextDecoder().decode(r.body)));

/* ---- artwork, loaded as it scrolls into view ---- */
const artUrl = (path, size = "w780") => ART_HOST + "/img/" + size + "/" + String(path).replace(/^\//, "") + "/q65.webp";
const imageUrl = (path, size = "w780") => path ? artUrl(path, size) : "";
const blobs = new Map();
const imageQueue = [];
let imageBusy = 0;
function queueImage(el) {
  if (!el || !el.dataset.src || el.dataset.queued) return;
  el.dataset.queued = "1";
  imageQueue.push(el);
  pumpImages();
}
const seen = new IntersectionObserver(list => list.forEach(e => {
  if (!e.isIntersecting) return;
  seen.unobserve(e.target);
  queueImage(e.target);
}), { root: null, rootMargin: "320px" });
function paintImage(el, url) {
  if (el.tagName === "IMG") el.src = url; else el.style.backgroundImage = 'url("' + url + '")';
  delete el.dataset.src;
  delete el.dataset.queued;
}
function setImage(el, url, eager = false) {
  if (!url) return;
  if (blobs.has(url)) paintImage(el, blobs.get(url));
  else {
    delete el.dataset.queued;
    el.dataset.src = encode(url);
    seen.observe(el);
    if (eager) queueImage(el);
  }
}
function pumpImages() {
  while (imageBusy < 5 && imageQueue.length) {
    const el = imageQueue.shift(), url = el.dataset.src ? decode(el.dataset.src) : "";
    if (!url || blobs.has(url)) { if (url) paintImage(el, blobs.get(url)); continue; }
    imageBusy++;
    get(url).then(r => {
      const u = URL.createObjectURL(new Blob([r.body], { type: r.type || "image/webp" }));
      blobs.set(url, u);
      document.querySelectorAll("[data-src]").forEach(other => {
        if (other.dataset.src && decode(other.dataset.src) === url) paintImage(other, u);
      });
    }).catch(() => {}).finally(() => { imageBusy--; pumpImages(); });
  }
}

/* ---- titles ---- */
function clean(r, forced) {
  const type = forced || r.media_type || (r.name ? "tv" : "movie");
  const title = r.title || r.name || "";
  if (!title || !/^(movie|tv)$/.test(type)) return null;
  if (r.adult || ADULT_RE.test(title + " " + (r.overview || ""))) return null;
  const date = r.release_date || r.first_air_date || "";
  const back = r.backdrop_path || r.poster_path;
  const front = r.poster_path || r.backdrop_path;
  return {
    key: type + ":" + r.id, id: r.id, type, title,
    url: SITE + "/" + type + "/" + r.id,
    art: imageUrl(back), poster: imageUrl(front, "w342"),
    text: r.overview || "",
    year: date.slice(0, 4) || "",
    rating: Math.round((Number(r.vote_average) || 0) * 10) / 10,
    tags: (r.genre_ids || []).map(g => GENRES[g]).filter(Boolean).slice(0, 3)
  };
}
const ROWS = [
  ["Popular with classes", "/trending/all/week", null, true],
  ["Popular films", "/movie/popular", "movie", false],
  ["Highly rated films", "/movie/top_rated", "movie", false],
  ["New to the library", "/movie/now_playing", "movie", false],
  ["Popular series", "/tv/popular", "tv", false],
  ["Highly rated series", "/tv/top_rated", "tv", false],
  ["Now showing", "/tv/airing_today", "tv", false]
];
function fetchRow([name, path, type, ranked]) {
  return getJson(LIBRARY + path).then(j => ({
    name, ranked,
    items: (j.results || []).map(r => clean(r, type)).filter(Boolean).slice(0, 20)
  }));
}

const ANIME_ROWS = [
  { name: "Featured anime", type: "tv", paths: ["/tv/top_rated"], ranked: false },
  { name: "Anime series", type: "tv", paths: ["/trending/tv/week", "/tv/popular?page=2", "/tv/popular?page=3", "/tv/popular?page=4", "/tv/popular?page=6", "/tv/popular?page=7", "/tv/popular?page=8"], ranked: false },
  { name: "Anime films", type: "movie", paths: ["/movie/top_rated?page=1"], ranked: false }
];
let animeSeen = new Set();
function isAnime(r) {
  return r && r.original_language === "ja" && (r.genre_ids || []).includes(16);
}
async function fetchAnimeRow(row) {
  const lists = await Promise.all(row.paths.map(p => getJson(LIBRARY + p).then(j => j.results || []).catch(() => [])));
  const items = [];
  for (const r of [].concat(...lists)) {
    if (!isAnime(r)) continue;
    const k = String(r.id);
    if (animeSeen.has(k)) continue;
    animeSeen.add(k);
    const it = clean(r, row.type);
    if (it) items.push(it);
  }
  return { name: row.name, ranked: row.ranked, items: items.slice(0, 20) };
}

function metaHTML(item) {
  const parts = [];
  if (item.rating) parts.push('<span class="score">&#9733; ' + item.rating.toFixed(1) + "</span>");
  if (item.year) parts.push("<span>" + item.year + "</span>");
  parts.push('<span class="chip">' + (item.type === "tv" ? "Series" : "Film") + "</span>");
  item.tags.forEach(t => parts.push('<span class="chip">' + t + "</span>"));
  return parts.join("");
}

function card(item, opt = {}) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "card";
  b.style.setProperty("--i", opt.i || 0);
  b.innerHTML = '<div class="art"></div><div class="shade"></div>' +
    (opt.rank ? '<span class="rank">' + opt.rank + "</span>" : "") +
    '<div class="cap"><span class="t"></span><span class="s"></span></div>' +
    (opt.pct != null ? '<div class="prog"><i style="width:' + opt.pct + '%"></i></div>' : "");
  setImage(b.querySelector(".art"), item.art || item.poster);
  b.querySelector(".t").textContent = item.title;
  b.querySelector(".s").textContent = opt.note || [item.year, item.type === "tv" ? "Series" : "Film"].filter(Boolean).join(" · ");
  b.setAttribute("aria-label", "Play " + item.title);
  b.onclick = opt.click || (() => details(item));
  return b;
}

function row(name, items, opt = {}) {
  if (!items || !items.length) return null;
  const sec = document.createElement("section");
  sec.className = "row";
  sec.innerHTML = '<div class="row-head"><h2></h2><span class="hint"></span>' +
    '<div class="row-nav"><button type="button" aria-label="Scroll left">&#8249;</button><button type="button" aria-label="Scroll right">&#8250;</button></div></div>' +
    '<div class="strip"></div>';
  sec.querySelector("h2").textContent = name;
  if (opt.hint) sec.querySelector(".hint").textContent = opt.hint;
  const strip = sec.querySelector(".strip");
  items.forEach((it, i) => strip.appendChild(card(it, { rank: opt.ranked ? i + 1 : 0, i, note: opt.note, pct: opt.pct, click: opt.click })));
  const [left, right] = sec.querySelectorAll(".row-nav button");
  left.onclick = () => strip.scrollBy({ left: -strip.clientWidth * .85, behavior: "smooth" });
  right.onclick = () => strip.scrollBy({ left: strip.clientWidth * .85, behavior: "smooth" });
  return sec;
}

/* ---- continue watching ---- */
const allContinue = () => { try { const v = JSON.parse(localStorage.getItem(CONTINUE)); return Array.isArray(v) ? v : []; } catch (e) { return []; } };
const loadContinue = () => allContinue().filter(s => s && s.key && s.title && s.url && String(s.url).startsWith(SITE + "/"));
function saveSpot(spot) {
  const list = allContinue().filter(s => !(s && s.key === spot.key));
  if (!(spot.d && spot.t > spot.d - 90)) list.unshift(spot);
  try { localStorage.setItem(CONTINUE, JSON.stringify(list.slice(0, 12))); } catch (e) {}
}

/* ---- hero and pages ---- */
let viewRun = 0, section = "all", heroItems = [], heroAt = 0, heroTimer = 0;
function hero(item) {
  const h = document.createElement("section");
  h.id = "hero";
  h.innerHTML = '<div class="art"></div><div class="fade"></div><div class="copy">' +
    '<div class="eyebrow">Educational films &amp; series</div><h1></h1><div class="meta"></div><p></p>' +
    '<div class="actions"><button class="btn main" type="button">&#9654; Play</button><button class="btn more" type="button">More info</button></div></div>' +
    '<div class="dots"></div>';
  setImage(h.querySelector(".art"), item.art || item.poster, true);
  h.querySelector("h1").textContent = item.title;
  h.querySelector(".meta").innerHTML = metaHTML(item);
  h.querySelector("p").textContent = item.text || "A classroom-friendly pick. Open it to watch.";
  h.querySelector(".btn.main").onclick = () => {
    if (item.type === "tv") details(item);
    else play(item);
  };
  h.querySelector(".more").onclick = () => details(item);
  const dots = h.querySelector(".dots");
  heroItems.forEach((_, i) => {
    const d = document.createElement("button");
    d.type = "button";
    d.className = i === heroAt ? "on" : "";
    d.setAttribute("aria-label", "Featured title " + (i + 1));
    d.onclick = () => { heroAt = i; rotateHero(); };
    dots.appendChild(d);
  });
  return h;
}
function rotateHero() {
  clearInterval(heroTimer);
  if (!heroItems.length) return;
  const old = $("hero");
  const next = hero(heroItems[heroAt % heroItems.length]);
  if (old) old.replaceWith(next); else $("browse").prepend(next);
  heroTimer = setInterval(() => { heroAt++; rotateHero(); }, 9000);
}
function showContinue(box) {
  const spots = loadContinue();
  if (!spots.length) return;
  const sec = row("Continue watching", spots.map(s => ({ key: s.key, title: s.title, art: s.art, poster: s.poster,
    year: s.year, type: s.type, id: s.id, url: s.url, season: s.season, episode: s.episode })), {
    note: "", click: s => play(s, 0, { season: s.season, episode: s.episode }),
    pct: 0
  });
  if (!sec) return;
  // progress belongs to the individual card, not the whole row
  sec.querySelectorAll(".card").forEach((c, i) => {
    const s = spots[i], pct = s.d ? Math.round(100 * s.t / s.d) : 0;
    c.querySelector(".s").textContent = s.d ? Math.max(1, Math.round((s.d - s.t) / 60)) + " min left" : "Resume";
    c.querySelector(".prog i").style.width = pct + "%";
    c.onclick = () => play(s, s.t, { season: s.season, episode: s.episode });
  });
  box.appendChild(sec);
}
function home() {
  clearInterval(heroTimer);
  const run = ++viewRun;
  section = section || "all";
  $("q").value = "";
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.section === section));
  $("browse").replaceChildren();
  const hold = document.createElement("div");
  hold.id = "continue";
  $("browse").appendChild(hold);
  showContinue(hold);
  const anime = section === "anime";
  if (anime) animeSeen = new Set();
  const status = document.createElement("p");
  status.className = "msg";
  status.textContent = anime ? "Loading anime…" : "Loading films…";
  $("browse").appendChild(status);
  const wanted = anime ? ANIME_ROWS : ROWS;
  const load = anime ? fetchAnimeRow : fetchRow;
  const slots = wanted.map(() => {
    const s = document.createElement("div");
    s.className = "row-slot";
    $("browse").appendChild(s);
    return s;
  });
  let shown = 0, first = true;
  const finish = () => {
    if (run !== viewRun) return;
    if (!shown) {
      status.textContent = anime
        ? "Couldn't load the anime. Check the connection and try again."
        : "Couldn't load the films. Check the connection and try again.";
      return;
    }
    const foot = document.createElement("div");
    foot.className = "foot";
    foot.textContent = "A hand-picked film library for learning and enrichment. Everything stays here to watch.";
    $("browse").appendChild(foot);
  };
  const draw = (i, r) => {
    if (run !== viewRun) return;
    if (r && r.items && r.items.length) {
      status.remove();
      if (first) {
        heroItems = r.items.slice(0, 5);
        heroAt = 0;
        rotateHero();
        first = false;
      }
      const sec = row(r.name, r.items, { ranked: r.ranked, hint: r.ranked ? "Top 10" : "" });
      if (sec) {
        sec.style.setProperty("--r", shown++);
        slots[i].replaceWith(sec);
        return;
      }
    }
    slots[i].remove();
  };
  const startRest = () => {
    if (run !== viewRun) return;
    const rest = wanted.slice(1).map((def, j) => load(def).then(r => draw(j + 1, r)).catch(() => draw(j + 1, { items: [] })));
    Promise.all(rest).then(finish);
  };
  load(wanted[0]).then(r => { draw(0, r); startRest(); }).catch(() => { draw(0, { items: [] }); startRest(); });
}
$("nav").onclick = e => {
  const b = e.target.closest("button[data-section]");
  if (!b) return;
  section = b.dataset.section === "anime" ? "anime" : "all";
  home();
};
$("brand").onclick = () => { section = "all"; home(); };
$("search").onsubmit = e => {
  e.preventDefault();
  const q = $("q").value.replace(/[^\p{L}\p{N}\s'-]/gu, " ").trim();
  if (!q) return home();
  const run = ++viewRun;
  clearInterval(heroTimer);
  $("browse").replaceChildren();
  const head = document.createElement("section");
  head.id = "hero";
  head.style.minHeight = "170px";
  head.style.alignItems = "center";
  head.style.padding = "96px clamp(16px, 4vw, 54px) 24px";
  head.innerHTML = '<div class="fade"></div><div class="copy"><div class="eyebrow">Search</div><h1></h1></div>';
  head.querySelector("h1").textContent = '“' + q + '”';
  $("browse").appendChild(head);
  const grid = document.createElement("div");
  grid.className = "grid";
  $("browse").appendChild(grid);
  const status = document.createElement("p");
  status.className = "msg";
  status.textContent = "Searching…";
  grid.before(status);
  getJson(LIBRARY + "/search/multi?query=" + encodeURIComponent(q)).then(j => {
    if (run !== viewRun) return;
    const seen = new Set();
    const items = [];
    for (const it of (j.results || []).map(r => clean(r)).filter(Boolean)) {
      const k = it.title.toLowerCase();
      if (seen.has(k)) continue;
      seen.add(k);
      items.push(it);
    }
    status.remove();
    if (!items.length) { status.textContent = "Nothing found. Try another title."; grid.after(status); return; }
    const count = document.createElement("div");
    count.className = "result-count";
    count.textContent = items.length + (items.length === 1 ? " result" : " results") + " for “" + q + "”";
    grid.before(count);
    items.forEach((it, i) => grid.appendChild(card(it, { i })));
  }).catch(() => { if (run === viewRun) { status.textContent = "Search couldn't reach the library. Try again."; } });
};

/* ---- one title, with season and episode picking ---- */
let current = null, pick = { season: 1, episode: 1 }, pickerRun = 0;
const episodeCache = new Map();
function artFor(item, path, size) { return path ? artUrl(path, size) : ""; }
function genericEpisodes(count) {
  return Array.from({ length: Math.min(Math.max(Number(count) || 1, 1), 1000) }, (_, i) => ({ episode_number: i + 1, name: "Episode " + (i + 1) }));
}
async function loadSeasons(item) {
  const key = item.key + ":seasons";
  if (episodeCache.has(key)) return episodeCache.get(key);
  const j = await getJson(LIBRARY + "/tv/" + encodeURIComponent(item.id));
  const seasons = (j.seasons || []).filter(s => !ADULT_RE.test(s.name || ""))
    .sort((a, b) => (Number(a.season_number) || 0) - (Number(b.season_number) || 0));
  episodeCache.set(key, seasons);
  return seasons;
}
async function loadEpisodes(item, season) {
  const key = item.key + ":eps:" + season;
  if (episodeCache.has(key)) return episodeCache.get(key);
  const j = await getJson(LIBRARY + "/tv/" + encodeURIComponent(item.id) + "/season/" + encodeURIComponent(season));
  const eps = (j.episodes || []).filter(e => !ADULT_RE.test((e.name || "") + " " + (e.overview || "")));
  episodeCache.set(key, eps);
  return eps;
}
function renderSeasonOptions(seasons, selected) {
  const sel = $("d-season");
  sel.replaceChildren();
  sel.disabled = false;
  seasons.forEach(s => {
    const o = document.createElement("option");
    o.value = String(s.season_number);
    o.textContent = s.name || "Season " + s.season_number;
    sel.appendChild(o);
  });
  const pref = seasons.find(s => Number(s.season_number) === Number(selected))
    || seasons.find(s => Number(s.season_number) === 1) || seasons[0];
  sel.value = String(pref.season_number);
  return Number(pref.season_number);
}
function renderEpisodes(item, season, eps) {
  const box = $("d-eps");
  box.replaceChildren();
  $("d-epcount").textContent = eps.length + (eps.length === 1 ? " episode" : " episodes");
  const limit = 60;
  let shown = Math.min(limit, eps.length);
  function draw() {
    box.replaceChildren();
    eps.slice(0, shown).forEach(e => {
      const n = Number(e.episode_number != null ? e.episode_number : e.number);
      const name = e.name || e.title || "Episode " + n;
      const b = document.createElement("button");
      b.type = "button";
      b.className = "ep" + (n === pick.episode ? " on" : "");
      const still = e.still_path ? artFor(item, e.still_path, "w500") : "";
      if (still) { const art = document.createElement("span"); art.className = "art"; setImage(art, still); b.appendChild(art); }
      const shade = document.createElement("span"); shade.className = "shade"; b.appendChild(shade);
      const no = document.createElement("span"); no.className = "no"; no.textContent = "EP " + n; b.appendChild(no);
      const nm = document.createElement("span"); nm.className = "name"; nm.textContent = name; b.appendChild(nm);
      const mins = e.runtime || (e.runtimeSeconds ? Math.round(e.runtimeSeconds / 60) : 0);
      const date = e.air_date || e.aired || "";
      const meta = [mins ? mins + " min" : "", date ? String(date).slice(0, 4) : ""].filter(Boolean).join(" · ");
      if (meta) { const m = document.createElement("span"); m.className = "meta"; m.textContent = meta; b.appendChild(m); }
      b.setAttribute("aria-label", "Select " + item.title + ", season " + season + " episode " + n);
      b.onclick = () => {
        pick.episode = n;
        box.querySelectorAll(".ep.on").forEach(x => x.classList.remove("on"));
        b.classList.add("on");
        $("d-play").textContent = "▶ Play S" + season + " E" + n;
      };
      box.appendChild(b);
    });
    if (shown < eps.length) {
      const more = document.createElement("button");
      more.type = "button";
      more.className = "ep more";
      more.textContent = "Show " + Math.min(limit, eps.length - shown) + " more";
      more.onclick = () => { shown += limit; draw(); };
      box.appendChild(more);
    }
  }
  draw();
}
function showPicker(item) {
  const run = ++pickerRun;
  pick = { season: Number(item.season) || 1, episode: Number(item.episode) || 1 };
  if (item.type !== "tv") {
    $("d-picker").hidden = true;
    $("d-play").textContent = "▶ Play";
    return;
  }
  $("d-picker").hidden = false;
  $("d-season").replaceChildren();
  $("d-season").disabled = true;
  $("d-season").onchange = null;
  $("d-epcount").textContent = "Loading seasons…";
  $("d-eps").replaceChildren();
  $("d-play").textContent = "▶ Play";
  loadSeasons(item).then(seasons => {
    if (run !== pickerRun || current !== item) return;
    if (!seasons.length) throw new Error("no seasons");
    const s = renderSeasonOptions(seasons, pick.season);
    pick.season = s;
    $("d-epcount").textContent = "Loading episodes…";
    return loadEpisodes(item, s).then(list => {
      if (run !== pickerRun || current !== item) return;
      const eps = list.length ? list : genericEpisodes(1);
      if (!eps.some(e => Number(e.episode_number != null ? e.episode_number : e.number) === pick.episode)) pick.episode = 1;
      renderEpisodes(item, s, eps);
      $("d-play").textContent = "▶ Play S" + s + " E" + pick.episode;
      $("d-season").onchange = () => {
        const ns = Number($("d-season").value) || 1;
        pick.season = ns;
        pick.episode = 1;
        $("d-epcount").textContent = "Loading episodes…";
        $("d-eps").replaceChildren();
        loadEpisodes(item, ns).then(list2 => {
          if (run !== pickerRun || current !== item) return;
          renderEpisodes(item, ns, list2.length ? list2 : genericEpisodes(1));
          $("d-play").textContent = "▶ Play S" + ns + " E" + pick.episode;
        }).catch(() => {
          if (run !== pickerRun || current !== item) return;
          renderEpisodes(item, ns, genericEpisodes(1));
          $("d-play").textContent = "▶ Play S" + ns + " E1";
        });
      };
    });
  }).catch(() => {
    if (run !== pickerRun || current !== item) return;
    $("d-season").replaceChildren();
    const o = document.createElement("option"); o.value = "1"; o.textContent = "Season 1"; $("d-season").appendChild(o);
    $("d-season").disabled = true;
    pick.season = 1; pick.episode = 1;
    renderEpisodes(item, 1, genericEpisodes(item.episodeCount || 1));
    $("d-play").textContent = "▶ Play S1 E1";
  });
}
function details(item) {
  current = item;
  setImage($("d-cover"), item.art || item.poster, true);
  setImage($("d-poster"), item.poster || item.art, true);
  $("d-title").textContent = item.title;
  $("d-meta").innerHTML = metaHTML(item);
  $("d-text").textContent = item.text || "Open this title to watch it.";
  $("details").hidden = false;
  showPicker(item);
  $("d-play").focus();
}
function closeDetails() { pickerRun++; $("details").hidden = true; current = null; }
$("d-play").onclick = () => {
  if (!current) return;
  if (current.type === "tv") play(current, 0, { season: pick.season, episode: pick.episode });
  else play(current);
};
$("d-close").onclick = closeDetails;
$("d-close-x").onclick = closeDetails;
$("details").onclick = e => { if (e.target === $("details")) closeDetails(); };

/* ---- playing ---- */
let playing = null, seekTo = 0, ticker = 0, autoTimer = 0;
function nestedDoc() {
  try {
    const d = pane.contentDocument;
    if (!d) return null;
    // A few tabs can stay open; only .shown is the one on screen
    const f = d.querySelector("#view iframe.shown") || [...d.querySelectorAll("#view iframe")].at(-1);
    return f && f.contentDocument;
  } catch (e) { return null; }
}
function video() { const d = nestedDoc(); return d && d.querySelector("video"); }
function clickPlay() {
  clearInterval(autoTimer);
  let tries = 0;
  autoTimer = setInterval(() => {
    const d = nestedDoc();
    if (d) {
      const started = (d.body && /QUALITY|SERVER/i.test(d.body.innerText)) || [...d.querySelectorAll("video")].some(v => v.duration > 600);
      if (started) { clearInterval(autoTimer); $("p-wait").hidden = true; return; }
      // the trailer buttons are not .mv-btn--primary; this is the button that opens the film.
      // Next.js paints the HTML before its handlers attach, so keep trying until the player opens.
      const b = [...d.querySelectorAll("button.mv-btn--primary")].find(x => x.textContent.trim() === "Play");
      if (b) { b.click(); tries++; return; }
    }
    if (++tries > 80) {
      clearInterval(autoTimer);
      $("p-wait").textContent = "If playback doesn’t start, press Play in the player.";
    }
  }, 1000);
}
function playTarget(item, season, episode) {
  const s = Math.max(1, Number(season) || 1), e = Math.max(1, Number(episode) || 1);
  if (item.type === "tv") return SITE + "/tv/" + encodeURIComponent(item.id) + "/" + s + "/" + e + "?play=true";
  return String(item.url).split("?")[0] + "?play=true";
}
function play(item, at = 0, selected = null) {
  closeDetails();
  clearInterval(heroTimer);
  const explicit = !!(selected && (selected.season || selected.episode));
  const season = Number(explicit ? selected.season : (item.season || 1)) || 1;
  const episode = Number(explicit ? selected.episode : (item.episode || 1)) || 1;
  const url = playTarget(item, season, episode);
  const label = item.type === "tv" ? " · S" + season + " E" + episode : "";
  playing = { key: item.key || item.type + ":" + item.id, title: item.title, url,
    season, episode, art: item.art || item.poster, poster: item.poster, year: item.year,
    type: item.type, t: 0, d: 0 };
  seekTo = at || 0;
  $("p-title").textContent = item.title + label;
  $("p-wait").textContent = item.type === "tv" ? "Loading episode…" : "Loading film…";
  $("p-wait").hidden = false;
  $("player").hidden = false;
  document.body.classList.add("playing");
  ready.then(() => post({ [MSG]: "go", url }));
  clickPlay();
  clearInterval(ticker);
  ticker = setInterval(() => {
    const v = video();
    if (!v || !playing) return;
    if (!v.duration || v.duration < 600) return;  // a trailer or the short preview, not the film
    $("p-wait").hidden = true;
    if (seekTo && v.readyState >= 1) { try { v.currentTime = seekTo; } catch (e) {} seekTo = 0; }
    if (!seekTo && v.currentTime > 5) {
      playing.t = Math.floor(v.currentTime);
      playing.d = Math.floor(v.duration) || 0;
      saveSpot(playing);
    }
  }, 1500);
}
function stopPlaying() {
  clearInterval(ticker);
  clearInterval(autoTimer);
  const v = video();
  if (v && playing && v.currentTime > 5) {
    playing.t = Math.floor(v.currentTime);
    playing.d = Math.floor(v.duration) || 0;
    saveSpot(playing);
  }
  playing = null;
  post({ [MSG]: "stop" });
  document.body.classList.remove("playing");
  $("player").hidden = true;
  const hold = $("continue");
  if (hold) { hold.replaceChildren(); showContinue(hold); }
}
$("p-back").onclick = stopPlaying;
addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (!$("player").hidden) stopPlaying();
  else if (!$("details").hidden) closeDetails();
});

home();
</script>
