<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Chalk TV</title>
<link rel="icon" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Basic Mono, like Notebook */
  :root {
    --paper: #0b0b0b; --paper-2: #151515; --card: #1b1b1b; --ink: #f2f2f2; --pencil: #9a9a9a;
    --edge: #2e2e2e; --accent: #f2f2f2; --accent-ink: #0b0b0b; --r: 4px;
    --body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--paper); color: var(--ink); font: 15px/1.45 var(--body); overflow: hidden; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }

  /* ---- the top bar ---- */
  #top { display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 16px; border-bottom: 1px solid var(--edge); background: var(--paper-2); }
  #brand { font-weight: 700; font-size: 1.15rem; white-space: nowrap; background: none; border: 0; padding: 0; }
  #search { flex: 1; max-width: 460px; display: flex; margin-left: auto; }
  #q { flex: 1; min-width: 0; height: 34px; padding: 0 12px; background: var(--paper); border: 1px solid var(--edge); border-radius: var(--r); outline: 0; }
  #q:focus { border-color: var(--pencil); }

  /* ---- browsing ---- */
  #browse { position: absolute; top: 52px; left: 0; right: 0; bottom: 0; overflow-y: auto; padding: 8px 0 32px; }
  .row h2 { margin: 18px 16px 8px; font-size: 1rem; font-weight: 700; }
  .strip { display: flex; gap: 10px; overflow-x: auto; padding: 2px 16px 6px; scrollbar-width: thin; }
  .grid { display: flex; flex-wrap: wrap; gap: 14px 10px; padding: 2px 16px; }
  .card { flex: none; display: flex; flex-direction: column; align-self: flex-start; width: 132px; padding: 0; border: 0; background: none; text-align: left; }
  .poster { display: block; width: 132px; height: 190px; object-fit: cover; border-radius: var(--r); background: var(--card); border: 1px solid var(--edge); }
  .card:hover .poster, .card:focus-visible .poster { border-color: var(--ink); }
  .card:focus-visible { outline: none; }
  .card .t { display: block; margin-top: 6px; font-size: 0.85rem; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .card .y { display: block; color: var(--pencil); font-size: 0.78rem; }
  .bar { height: 3px; margin-top: 4px; background: var(--edge); border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--ink); }
  .msg { margin: 16px; color: var(--pencil); }
  .btn { height: 36px; padding: 0 16px; border-radius: var(--r); border: 1px solid var(--edge); background: var(--card); }
  .btn:hover { border-color: var(--pencil); }
  .btn.main { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }

  /* ---- one title ---- */
  #details { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0,0,0,.75); }
  #details .box { display: flex; gap: 20px; width: min(760px, 100%); max-height: 100%; overflow-y: auto; padding: 20px; background: var(--paper-2); border: 1px solid var(--edge); border-radius: var(--r); }
  #details .poster { flex: none; width: 170px; height: 245px; }
  #details h3 { margin: 0; font-size: 1.3rem; }
  #d-year { color: var(--pencil); margin: 2px 0 10px; }
  #d-text { margin: 0 0 14px; color: #cfcfcf; font-size: 0.9rem; max-height: 9em; overflow-y: auto; }
  #d-actions { display: flex; gap: 8px; }
  #d-eps { display: flex; flex-direction: column; gap: 4px; margin-top: 14px; max-height: 220px; overflow-y: auto; }
  #d-eps button { text-align: left; padding: 7px 10px; border: 1px solid var(--edge); border-radius: var(--r); background: var(--card); font-size: 0.88rem; }
  #d-eps button:hover { border-color: var(--pencil); }
  @media (max-width: 560px) { #details .box { flex-direction: column; } #details .poster { width: 120px; height: 172px; } }

  /* ---- the player: Tide plays the video, our bar sits above it ---- */
  #player { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; background: #000; }
  #p-bar { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 10px; background: var(--paper-2); border-bottom: 1px solid var(--edge); }
  #p-title { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--pencil); }
  #p-stage { position: relative; flex: 1; }
  /* Tide stays in the page the whole time (lists and posters come through it), out of sight until a video plays */
  #tide { position: fixed; width: 1px; height: 1px; left: -10px; top: 0; border: 0; opacity: 0; pointer-events: none; }
  body.playing #tide { left: 0; top: 44px; width: 100%; height: calc(100% - 44px); opacity: 1; pointer-events: auto; z-index: 21; background: #000; }
  #p-wait { position: absolute; inset: 0; display: grid; place-items: center; color: var(--pencil); }
</style>
</head>
<body>
<div id="top">
  <button id="brand" type="button" title="Home">Chalk TV</button>
  <form id="search" role="search"><input id="q" type="search" placeholder="Search films and shows" autocomplete="off" spellcheck="false" aria-label="Search"></form>
</div>
<main id="browse"></main>

<div id="details" hidden>
  <div class="box" role="dialog" aria-labelledby="d-title">
    <img class="poster" id="d-poster" alt="">
    <div style="flex:1;min-width:0">
      <h3 id="d-title"></h3>
      <div id="d-year"></div>
      <p id="d-text"></p>
      <div id="d-actions"><button class="btn main" id="d-play" type="button">Play</button><button class="btn" id="d-close" type="button">Close</button></div>
      <div id="d-eps"></div>
    </div>
  </div>
</div>

<div id="player" hidden>
  <div id="p-bar"><button class="btn" id="p-back" type="button">&#8249; Back</button><div id="p-title"></div></div>
  <div id="p-stage"><div id="p-wait">Loading…</div></div>
</div>

<script>
/* Chalk TV: free films and shows from the Internet Archive (archive.org), public domain or
   shared by their owners. Everything, lists, posters and video, comes through Tide (tide/). */
const $ = id => document.getElementById(id);
const IA = "https://archive.org";
const SOURCES = "(collection:feature_films OR collection:SciFi_Horror OR collection:silent_films OR collection:animationandcartoons OR collection:classic_tv)";
const ROWS = [
  ["Popular films", "collection:feature_films"],
  ["Comedy", "collection:feature_films AND subject:comedy"],
  ["Film noir", 'collection:feature_films AND subject:"film noir"'],
  ["Sci-fi and horror", "collection:SciFi_Horror"],
  ["Silent films", "collection:silent_films"],
  ["Cartoons", "collection:animationandcartoons"],
  ["Classic TV", "collection:classic_tv"]
];
const CONTINUE = "chalk-tv.continue";
const ADULT = ["sex", "sexy", "nude", "nudist", "naked", "erotic", "stripper", "striptease", "lust", "burlesque", "porn"];
const ADULT_RE = /\b(sex|sexy|nude|nudist|naked|erotic|stripper|striptease|lust|burlesque|porn)/i;   // same words as ADULT
for (const k of ["chalk-tv.site", "chalk-tv.mode", "chalk-tv.relay"]) try { localStorage.removeItem(k); } catch (e) {}   // the old Chalk TV's

/* ---- Tide, out of sight ---- */
const TIDE_PAGE = new URL("tide/", location.href).href;
const tideFrame = document.createElement("iframe");
tideFrame.id = "tide";
tideFrame.title = "Video";
tideFrame.allow = "fullscreen; autoplay; encrypted-media; picture-in-picture";
tideFrame.allowFullscreen = true;
tideFrame.src = TIDE_PAGE + "#tide=" + encodeURIComponent(JSON.stringify({ ui: "tv", fresh: true }));
document.body.appendChild(tideFrame);
let ready, readyNow;
ready = new Promise(ok => { readyNow = ok; });
let seq = 0;
const waiting = new Map();
const tide = msg => tideFrame.contentWindow.postMessage(msg, location.origin);
addEventListener("message", e => {
  if (e.source !== tideFrame.contentWindow || e.origin !== location.origin || !e.data) return;
  if (e.data.tide === "ready") readyNow();
  if (e.data.tide === "fetched" && waiting.has(e.data.id)) { waiting.get(e.data.id)(e.data); waiting.delete(e.data.id); }
});
/* one GET through Tide; resolves with { status, type, body } */
function get(url) {
  return ready.then(() => new Promise((ok, fail) => {
    const id = ++seq;
    const timer = setTimeout(() => { waiting.delete(id); fail(new Error("timed out")); }, 25000);
    waiting.set(id, r => { clearTimeout(timer); r.status === 200 ? ok(r) : fail(new Error(r.error || "status " + r.status)); });
    tide({ tide: "fetch", id, url });
  }));
}
const getJson = url => get(url).then(r => JSON.parse(new TextDecoder().decode(r.body)));

/* ---- the Archive ---- */
function find(q, rows) {
  // only items with a video Chalk TV can play, and nothing with an adult title (it's a school site)
  const p = new URLSearchParams({ q: q + ' AND mediatype:movies AND format:(MPEG4 OR "h.264") AND NOT title:(' + ADULT.join(" OR ") + ")", rows: String(rows), output: "json" });
  ["identifier", "title", "year"].forEach(f => p.append("fl[]", f));
  p.append("sort[]", "downloads desc");
  return getJson(IA + "/advancedsearch.php?" + p).then(j => j.response.docs.filter(d => d.title && !ADULT_RE.test(d.title)));
}
/* an item's videos: one per film or episode, the smaller 512kb copy when there is one */
function videosOf(meta) {
  const best = new Map();
  for (const f of meta.files || []) {
    if (!/\.mp4$/i.test(f.name)) continue;
    const base = f.name.replace(/(_512kb)?\.mp4$/i, "");
    if (!best.has(base) || /_512kb\.mp4$/i.test(f.name)) best.set(base, f);
  }
  return [...best.entries()].sort((a, b) => a[0].localeCompare(b[0], undefined, { numeric: true })).map(([base, f]) => ({
    label: f.title || base.split("/").pop().replace(/[_]+/g, " "),
    url: IA + "/download/" + encodeURIComponent(meta.metadata.identifier) + "/" + f.name.split("/").map(encodeURIComponent).join("/")
  }));
}

/* ---- posters: fetched as they scroll into view, a few at a time ---- */
const posters = new Map();   // identifier -> blob URL
const queue = [];
let busy = 0;
const seen = new IntersectionObserver(list => list.forEach(e => {
  if (!e.isIntersecting) return;
  seen.unobserve(e.target);
  queue.push(e.target);
  pump();
}), { root: null, rootMargin: "300px" });
function pump() {
  while (busy < 4 && queue.length) {
    const img = queue.shift(), id = img.dataset.id;
    if (posters.has(id)) { img.src = posters.get(id); continue; }
    busy++;
    get(IA + "/services/img/" + encodeURIComponent(id))
      .then(r => { const u = URL.createObjectURL(new Blob([r.body], { type: r.type })); posters.set(id, u); document.querySelectorAll('img[data-id="' + CSS.escape(id) + '"]').forEach(i => { i.src = u; }); })
      .catch(() => {})
      .finally(() => { busy--; pump(); });
  }
}
function card(item, extra) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "card";
  b.innerHTML = '<img class="poster" alt=""><span class="t"></span><span class="y"></span>';
  const img = b.querySelector("img");
  img.dataset.id = item.identifier;
  if (posters.has(item.identifier)) img.src = posters.get(item.identifier); else seen.observe(img);
  b.querySelector(".t").textContent = item.title;
  b.querySelector(".y").textContent = extra ? extra.note : (item.year || "");
  if (extra) { const bar = document.createElement("div"); bar.className = "bar"; bar.innerHTML = "<i></i>"; bar.firstChild.style.width = extra.pct + "%"; b.appendChild(bar); }
  b.onclick = extra ? extra.click : () => details(item);
  return b;
}
function row(title, cls = "strip") {
  const s = document.createElement("section");
  s.className = "row";
  s.innerHTML = '<h2></h2><div class="' + cls + '"></div>';
  s.querySelector("h2").textContent = title;
  $("browse").appendChild(s);
  return s.lastChild;
}

/* ---- Continue watching ---- */
const loadContinue = () => { try { const v = JSON.parse(localStorage.getItem(CONTINUE)); return Array.isArray(v) ? v : []; } catch (e) { return []; } };
function saveSpot(spot) {
  let list = loadContinue().filter(s => s.id !== spot.id);
  if (!(spot.d && spot.t > spot.d - 90)) list.unshift(spot);   // nearly finished drops off
  try { localStorage.setItem(CONTINUE, JSON.stringify(list.slice(0, 12))); } catch (e) {}
}

function showContinue() {
  const box = $("continue");
  if (!box) return;
  box.replaceChildren();
  const spots = loadContinue();
  if (!spots.length) return;
  const s = row("Continue watching");
  box.appendChild(s.parentNode);
  for (const sp of spots) {
    const left = sp.d ? Math.max(1, Math.round((sp.d - sp.t) / 60)) + " min left" : "";
    s.appendChild(card({ identifier: sp.id, title: sp.title }, { note: (sp.label && sp.label !== sp.title ? sp.label + " · " : "") + left, pct: sp.d ? Math.round(100 * sp.t / sp.d) : 0, click: () => play(sp, sp.t) }));
  }
}

/* ---- pages ---- */
let homeRun = 0;
function home() {
  const run = ++homeRun;
  $("browse").replaceChildren();
  $("q").value = "";
  $("browse").appendChild(Object.assign(document.createElement("div"), { id: "continue" }));
  showContinue();
  const status = Object.assign(document.createElement("p"), { className: "msg", textContent: "Loading…" });
  $("browse").appendChild(status);
  let shown = 0;
  ROWS.reduce((p, [title, q]) => p.then(() => run === homeRun && find(q, 24).then(items => {
    if (run !== homeRun || !items.length) return;
    shown++;
    status.remove();
    const strip = row(title);
    items.forEach(i => strip.appendChild(card(i)));
  }).catch(() => {})), Promise.resolve()).then(() => {
    if (run === homeRun && !shown) failed(status, home);
  });
}
function failed(el, retry) {
  el.textContent = "Chalk TV couldn't reach the Archive. ";
  const b = Object.assign(document.createElement("button"), { className: "btn", type: "button", textContent: "Try again" });
  b.onclick = retry;
  el.appendChild(b);
}
$("search").onsubmit = e => {
  e.preventDefault();
  const words = $("q").value.replace(/[^\p{L}\p{N}\s'-]/gu, " ").trim();
  if (!words) return home();
  const run = ++homeRun;
  $("browse").replaceChildren();
  const grid = row('Results for "' + words + '"', "grid");
  const status = Object.assign(document.createElement("p"), { className: "msg", textContent: "Searching…" });
  grid.before(status);
  const go = () => find("title:(" + words + ") AND " + SOURCES, 60).then(items => {
    if (run !== homeRun) return;
    status.textContent = items.length ? "" : "Nothing found.";
    items.forEach(i => grid.appendChild(card(i)));
  }).catch(() => { if (run === homeRun) failed(status, go); });
  go();
};
$("brand").onclick = home;

/* ---- one title ---- */
let current = null;
function details(item) {
  current = { item, videos: [] };
  $("d-title").textContent = item.title;
  $("d-year").textContent = item.year || "";
  $("d-text").textContent = "Loading…";
  $("d-eps").replaceChildren();
  $("d-play").disabled = true;
  $("d-poster").src = posters.get(item.identifier) || "";
  $("details").hidden = false;
  $("d-play").focus();
  getJson(IA + "/metadata/" + encodeURIComponent(item.identifier)).then(meta => {
    if (!current || current.item !== item) return;
    const raw = (meta.metadata && meta.metadata.description) || "";
    const text = new DOMParser().parseFromString(Array.isArray(raw) ? raw.join(" ") : raw, "text/html").body.textContent.trim();
    $("d-text").textContent = text.length > 700 ? text.slice(0, 700) + "…" : text;
    current.videos = videosOf(meta);
    if (!current.videos.length) { $("d-text").textContent = "This one has no video Chalk TV can play."; return; }
    if (current.videos.length === 1) current.videos[0].label = item.title;
    const spot = loadContinue().find(s => s.id === item.identifier);
    $("d-play").disabled = false;
    $("d-play").textContent = spot ? "Resume" : "Play";
    $("d-play").onclick = () => spot ? play(spot, spot.t) : play(spotFor(item, current.videos[0]), 0);
    if (current.videos.length > 1) current.videos.forEach(v => {
      const b = Object.assign(document.createElement("button"), { type: "button", textContent: v.label });
      b.onclick = () => play(spotFor(item, v), 0);
      $("d-eps").appendChild(b);
    });
  }).catch(() => { $("d-text").textContent = "Couldn't load this one. Close and try again."; });
}
const spotFor = (item, v) => ({ id: item.identifier, title: item.title, label: v.label, url: v.url, t: 0, d: 0 });
$("d-close").onclick = () => { $("details").hidden = true; current = null; };
$("details").onclick = e => { if (e.target === $("details")) $("d-close").onclick(); };

/* ---- playing ---- */
let playing = null, seekTo = 0, ticker = 0;
function video() {   // the <video> in the page Tide opened (same site, so it can be reached)
  try { const f = tideFrame.contentDocument.querySelector("#view iframe"); return f && f.contentDocument && f.contentDocument.querySelector("video"); } catch (e) { return null; }
}
function play(spot, at) {
  $("details").hidden = true;
  playing = Object.assign({}, spot);
  seekTo = at || 0;
  $("p-title").textContent = spot.label && spot.label !== spot.title ? spot.title + " · " + spot.label : spot.title;
  $("player").hidden = false;
  document.body.classList.add("playing");
  ready.then(() => tide({ tide: "go", url: spot.url }));
  clearInterval(ticker);
  ticker = setInterval(() => {
    const v = video();
    if (!v || !playing) return;
    if (!v.dataset.fit) { v.dataset.fit = "1"; v.style.cssText = "position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000"; }   // fill the player, not the film's own small size
    if (seekTo && v.readyState >= 1) { v.currentTime = seekTo; seekTo = 0; }
    if (!seekTo && v.currentTime > 5) { playing.t = Math.floor(v.currentTime); playing.d = Math.floor(v.duration) || 0; saveSpot(playing); }
  }, 1500);
}
function stopPlaying() {
  clearInterval(ticker);
  const v = video();
  if (v && playing && v.currentTime > 5) { playing.t = Math.floor(v.currentTime); playing.d = Math.floor(v.duration) || 0; saveSpot(playing); }
  playing = null;
  tide({ tide: "stop" });   // the video and its buffers go
  document.body.classList.remove("playing");
  $("player").hidden = true;
  showContinue();
}
$("p-back").onclick = stopPlaying;
addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (!$("player").hidden) stopPlaying(); else if (!$("details").hidden) $("d-close").onclick();
});

home();
</script>
</body>
</html>
