<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Hall</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    padding: 24px;
    background: #f5f1e8;
    color: #26324a;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .boot { width: min(420px, 100%); text-align: center; }
  .mark {
    width: 42px;
    height: 42px;
    margin: 0 auto 18px;
    border: 2px solid #26324a;
    border-radius: 50%;
    position: relative;
  }
  .mark::after {
    content: "";
    position: absolute;
    inset: 9px;
    border: 2px solid #26324a;
    border-radius: 50%;
    opacity: 0.45;
  }
  h1 { margin: 0 0 8px; font-size: 1.05rem; font-weight: 600; letter-spacing: 0.02em; }
  p { margin: 0; color: #66708a; font-size: 0.9rem; line-height: 1.5; }
  button {
    margin-top: 18px;
    padding: 9px 16px;
    border: 1px solid #26324a;
    border-radius: 3px;
    background: #fff;
    color: #26324a;
    font: inherit;
    cursor: pointer;
  }
  button:hover { background: #26324a; color: #fff; }
  [hidden] { display: none !important; }
</style>
</head>
<body data-study-shell="1">
<main class="boot" aria-live="polite">
  <div class="mark" aria-hidden="true"></div>
  <h1>Study Hall</h1>
  <p id="boot-status">Opening your study page&hellip;</p>
  <button id="retry" type="button" hidden>Try again</button>
</main>
<script>
(() => {
  const APP = 's.txt?v=20261109';
  const MARK = '<title>Study Hall</title>';
  const status = document.getElementById('boot-status');
  const retry = document.getElementById('retry');
  let busy = false;

  async function open() {
    if (busy) return;
    busy = true;
    retry.hidden = true;
    status.textContent = 'Opening your study page...';
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 15000);
    try {
      const res = await fetch(APP, { cache: 'no-store', credentials: 'same-origin', signal: ctrl.signal });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const html = await res.text();
      if (!html.includes(MARK)) throw new Error('Unexpected page');
      document.open();
      document.write(html);
      document.close();
    } catch (err) {
      busy = false;
      status.textContent = 'This page could not open here.';
      retry.hidden = false;
    } finally {
      clearTimeout(timer);
    }
  }

  retry.addEventListener('click', open);
  open();
})();
</script>
</body>
</html>
