<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Chalk Browser</title>
<link rel="icon" href="favicon.svg">
<style>
  /* Basic Mono, like Notebook. No web fonts: a font stylesheet would hold up Tide's start */
  :root { --card: #121212; --ink: #f2f2f2; --pencil: #9a9a9a; --edge: #2e2e2e; --accent: #f2f2f2; --accent-ink: #0b0b0b; --r: 4px; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  html { background: transparent; }
  body { background: rgba(82, 85, 92, 0.42); color: var(--ink); font: 15px/1.5 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }
  #tide-full { position: fixed; inset: 0; width: 100%; height: 100%; border: none; background: transparent; }
  /* inside Notebook, asked once: keep Chalk Browser open while you're on other tabs? */
  #keep-box {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 2; width: calc(100% - 32px); max-width: 400px;
    padding: 16px 18px; background: var(--card); border: 1px solid var(--edge); border-radius: var(--r);
  }
  #keep-box b { display: block; margin-bottom: 4px; }
  #keep-box p { margin: 0 0 12px; color: var(--pencil); font-size: 0.85rem; }
  #keep-box .row { display: flex; gap: 8px; }
  #keep-box button { flex: 1; height: 36px; border-radius: var(--r); border: 1px solid var(--edge); background: transparent; }
  #keep-box #keep-yes { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
</style>
</head>
<body>
<div id="keep-box" hidden>
  <b>Remember Chalk Browser when you switch tabs?</b>
  <p>It stays open, right where you left it, while you're in Games or anywhere else. Turning this off saves memory.</p>
  <div class="row"><button id="keep-yes" type="button">Yes, remember it</button><button id="keep-no" type="button">No, save memory</button></div>
</div>
<script>
/* Chalk Browser is Tide (github.com/Guernica4u/Tide), from tide/ on this same site, filling the page.
   ?url=<site> opens that site first. */
const TIDE_PAGE = new URL("tide/", location.href).href;
/* "1": Notebook keeps Chalk Browser open on other tabs; "0": it closes it to save memory */
const KEEP_STORE = "chalk-browser.keep";
const $ = id => document.getElementById(id);
for (const k of ["chalk-browser.settings", "chalk-browser.mode", "chalk-tv.tide.enc"]) try { localStorage.removeItem(k); } catch (e) {}   // old settings

function startUrl() {
  let raw = String(new URLSearchParams(location.search).get("url") || "").trim();
  if (!raw) return null;
  if (!/^[a-z][a-z0-9+.-]*:/i.test(raw)) raw = "https://" + raw;
  try { const u = new URL(raw); return /^https?:$/.test(u.protocol) ? u.href : null; } catch (e) { return null; }
}

const f = document.createElement("iframe");
f.id = "tide-full";
f.title = "Chalk Browser";
f.allow = "fullscreen; autoplay; encrypted-media; picture-in-picture; clipboard-write";
f.allowFullscreen = true;
/* a site can't take over the whole tab or open real tabs (Tide opens them as its own tabs) */
f.setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms allow-modals allow-pointer-lock allow-presentation allow-orientation-lock allow-downloads");
const start = startUrl();
f.src = TIDE_PAGE + (start ? "#tide=" + encodeURIComponent(JSON.stringify({ open: start })) : "");
document.body.appendChild(f);

/* ---- inside Notebook: remember Chalk Browser between tabs? Asked once ---- */
function answerKeep(v) {
  try { localStorage.setItem(KEEP_STORE, v); } catch (e) {}
  $("keep-box").hidden = true;
}
$("keep-yes").onclick = () => answerKeep("1");
$("keep-no").onclick = () => answerKeep("0");
let inNotebook = false;
try { inNotebook = parent !== window && /notebook/.test(parent.location.pathname); } catch (e) {}
try { if (inNotebook && localStorage.getItem(KEEP_STORE) === null) $("keep-box").hidden = false; } catch (e) {}
</script>
</body>
</html>
